<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Navigator</title>
  <link rel="stylesheet" href="indexDesign.css" />
</head>
<body>

  <!-- Форма входа -->
  <div id="loginForm">
    <h2>Вход</h2>
    <input type="text" id="loginUser" placeholder="Логин" />
    <input type="password" id="loginPass" placeholder="Пароль" />
    <button onclick="login()">Войти</button>
    <button onclick="showRegister()">Регистрация</button>
  </div>

  <!-- Форма регистрации -->
  <div id="registerForm" style="display:none;">
    <h2>Регистрация</h2>
    <input type="text" id="regUser" placeholder="Логин" />
    <input type="password" id="regPass" placeholder="Пароль (мин. 8 символов)" />
    <button onclick="register()">Зарегистрироваться</button>
    <button onclick="showLogin()">Вход</button>
  </div>

  <!-- Основной интерфейс -->
  <div id="mainInterface" style="display:none;">
    <div class="container">
      <header class="header">
        <div class="brand"><strong>Secure Navigator</strong></div>
        <div class="header-actions">
          <span id="userInfo">👤 Пользователь</span>
          <button id="themeToggle" class="theme-toggle">☀️</button>
          <button onclick="logout()">Выйти</button>
          <button id="adminPanelBtn" style="display:none;">Панель управления</button>
        </div>
      </header>

      <div class="controls">
        <h3 class="section-title">Навигация</h3>
        <div class="control-row">
          <label class="label">Откуда</label>
          <select id="fromSelect" class="select"><option>Выберите локацию</option></select>
        </div>
        <div class="control-row">
          <label class="label">Куда</label>
          <select id="toSelect" class="select"><option>Выберите локацию</option></select>
        </div>
        <button id="applyBtn" class="btn btn-primary">Воспроизвести</button>

        <h3 class="section-title">Добавить контент</h3>
        <div class="control-row">
          <label class="label">Добавить локацию</label>
          <input id="newLocationName" class="select" placeholder="Название локации" />
          <button onclick="addLocation()" class="btn btn-primary">Добавить</button>
        </div>
        <div class="control-row">
          <label class="label">Маршрут</label>
          <select id="newRouteFrom" class="select"><option>Из...</option></select>
          <select id="newRouteTo" class="select"><option>В...</option></select>
          <input id="newVideoUrl" class="select" placeholder="URL видео (RuTube, MP4, m3u8)" />
          <button onclick="addRoute()" class="btn btn-primary">Добавить маршрут</button>
        </div>
      </div>

      <div class="player-area">
        <div id="player"></div>
        <div class="meta muted">Выберите маршрут для воспроизведения</div>
      </div>
    </div>
  </div>

  <!-- Модальное окно админки -->
  <div id="adminModal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Панель управления</h3>
        <button onclick="closeAdminPanel()">×</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="openTab('pendingTab')">Ожидающие</button>
        <button class="tab-btn" onclick="openTab('approvedTab')">Одобренные</button>
        <button class="tab-btn" onclick="openTab('logsTab')">Логи</button>
      </div>
      <div class="modal-body">
        <div id="pendingTab" class="tab-content active">
          <div id="pendingList"></div>
        </div>
        <div id="approvedTab" class="tab-content">
          <div id="approvedList"></div>
        </div>
        <div id="logsTab" class="tab-content">
          <div id="logsList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="navigationScript.js"></script>
</body>
</html>
